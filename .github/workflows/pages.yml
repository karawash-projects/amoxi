name: Website

# Builds the showcase site in website/ (an Amoxi app), exports it to static HTML and
# publishes it with GitHub Pages. Enable Pages once: Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'packages/framework/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w amoxi
      - run: npm test -w website
      - name: Export to static HTML
        working-directory: website
        shell: bash
        run: |
          # Project sites live under /<repository>/; a <owner>.github.io repository lives at the root.
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then base=""; else base="/$repo"; fi
          npx amoxi export --strict --base-path "$base"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
