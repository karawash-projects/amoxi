version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The compiler uses the TypeScript JavaScript API, which the Go-based TypeScript 7 doesn't provide.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Amoxi supports Node.js 22 and newer, so its types stay on the oldest supported version.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
